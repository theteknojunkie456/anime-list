name: Chapter counts

# MangaUpdates returns 403 to Cloudflare Workers and to browsers, so the lookup
# can't live in the app or the notify worker. A GitHub runner is neither, so it
# gets a normal answer — this fetches the counts and commits them, and Pages
# serves the result to both.
on:
  schedule:
    # Hourly, but the script decides whether to do anything: it works every hour
    # on the days a tracked series actually releases, and falls back to roughly
    # every six hours otherwise. The release days come from the data, not from
    # this file, so they follow a series that changes its schedule.
    - cron: '17 * * * *'     # every hour, offset off the hour
  workflow_dispatch:          # and on demand, which is how to test it

permissions:
  contents: write

concurrency:
  group: chapters
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch chapter counts
        env:
          # Same secret the announce workflow uses — it must match the notify
          # worker's ADMIN_TOKEN, and it already exists in this repo.
          ADMIN_TOKEN: ${{ secrets.NOTIFY_ADMIN_TOKEN }}
        run: node scripts/chapters.mjs

      - name: Commit if anything moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/chapters.json; then
            echo "no change"
            exit 0
          fi
          git add data/chapters.json
          git commit -m "Chapter counts: refresh [skip ci]"
          git push
