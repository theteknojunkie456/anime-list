# XcodeGen spec — generates WatchListParty.xcodeproj from the loose Swift files.
# Run:  xcodegen generate   (from this folder). Then open WatchListParty.xcodeproj.
#
# Two targets:
#   • WatchListParty  — the app you tap (SwiftUI): set a party code, Start Broadcast.
#   • BroadcastExt    — the ReplayKit Broadcast Upload Extension that captures the
#                       screen and sends it over WebRTC to your friends.
# No App Groups (those need a PAID account) — the app and extension share the party
# code through a private named pasteboard instead (see AppGroup.swift), so this signs
# and runs on a FREE Apple ID.
name: WatchListParty
options:
  bundleIdPrefix: com.humblezone.watchlist
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: "150.0.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "8"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: "NO"
    CODE_SIGN_STYLE: Automatic
    # Put all app code in the main binary. Xcode's Debug "debug dylib" split
    # (the default) does NOT load when the app is installed outside Xcode (e.g.
    # via devicectl), so the app launches to a black screen. Keep this NO.
    ENABLE_DEBUG_DYLIB: "NO"
    # The team lives HERE, not only in the generated project. It used to be set
    # by hand in Xcode and stored nowhere else, so regenerating the project threw
    # it away and the next build failed to sign until somebody remembered to pick
    # it again — which is the whole reason regenerating was never automated.
    # A Team ID is an account identifier, not a secret: it ships inside every
    # signed build and was already committed in project.pbxproj.
    DEVELOPMENT_TEAM: NGEK7NY2X4

targets:
  WatchListParty:
    type: application
    platform: iOS
    sources:
      - WatchListBroadcastApp.swift
      - ContentView.swift
      - AppGroup.swift
      - Assets.xcassets
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: WatchList
        # Without these two the generated plist takes XcodeGen's defaults —
        # CFBundleVersion 1 — and the CURRENT_PROJECT_VERSION below never
        # reaches the bundle. Every build this project has ever produced
        # installed as 1.0 (1), so ios-sync.sh's bump wrote a number nothing
        # read, the device could not tell one build from the next, and two
        # uploads would collide on the same build number.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Uses only standard/exempt encryption (HTTPS) — declare it so TestFlight
        # stops asking the export-compliance question on every upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        NSFaceIDUsageDescription: Unlock WatchList with Face ID.
        NSPhotoLibraryUsageDescription: Choose a cover or background image for a title.
        NSCameraUsageDescription: Take a photo to use as a cover or background image.
        NSMicrophoneUsageDescription: Talk in a watch party — voice chat and screen-share audio.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.humblezone.watchlist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BroadcastExt
      # WebRTC is declared on the extension, which is the target whose code uses
      # it — but an app extension cannot carry its own copy of a dynamic
      # framework. It resolves @rpath/WebRTC.framework against the HOST APP's
      # Frameworks directory, and nothing was putting it there: the build
      # succeeded, left WebRTC.framework in Build/Products, and shipped a bundle
      # with no Frameworks directory at all. Starting a broadcast would have
      # failed to load the dylib every time. Declaring it here too is what
      # embeds it in the app, where the extension can actually find it.
      - package: WebRTC

  BroadcastExt:
    type: app-extension
    platform: iOS
    sources:
      - SampleHandler.swift
      - PartySignaling.swift
      - WebRTCBroadcaster.swift
      - BroadcastAudioDevice.swift
      - AppGroup.swift
    info:
      path: Generated/Ext-Info.plist
      properties:
        CFBundleDisplayName: WatchListBroadcast
        # An extension whose version does not match its host app is rejected at
        # install time, so it reads the same two settings rather than its own.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.humblezone.watchlist.BroadcastExt
    dependencies:
      - package: WebRTC
