<!-- The OLD mark, in the NEW colours — which is the combination that was
     actually wanted. The composition was never the problem: a play, a title,
     and a line part-filled to say how far through you are. What dated it was
     the hot orange-to-magenta gradient, which belonged to nothing else in the
     app. So the shapes come back exactly as they were, soft pill corners and
     all, on the ink ground with the one jade measure. The decoration is still
     the data, which is the whole idea downstairs. -->
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1b1f24"/><stop offset="1" stop-color="#0c0e11"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#ink)"/>
  <!-- the play, in the accent: the one thing you press -->
  <path d="M150 150l52 30-52 30z" fill="#56d6bd"/>
  <!-- the title line -->
  <rect x="224" y="158" width="140" height="44" rx="22" fill="#edeef0"/>
  <!-- the measure: a track, and how far through it you are -->
  <rect x="150" y="242" width="212" height="40" rx="20" fill="#edeef0" fill-opacity="0.18"/>
  <rect x="150" y="242" width="138" height="40" rx="20" fill="#56d6bd"/>
  <!-- the one after it, waiting -->
  <rect x="150" y="322" width="150" height="40" rx="20" fill="#edeef0" fill-opacity="0.46"/>
</svg>
